<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF Viewer</title>
    <link rel="stylesheet" href="tokens.css" />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: var(--color-viewer-bg);
        color: var(--color-viewer-text);
        font-family: var(--font-family);
      }

      .status {
        display: grid;
        place-items: center;
        height: 100%;
        padding: 20px;
        text-align: center;
      }

      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: none;
        background: var(--color-surface);
      }
    </style>
  </head>
  <body>
    <div id="status" class="status">Loading PDF...</div>
    <iframe id="pdfFrame" title="PDF"></iframe>
    <script src="viewer.js"></script>
  </body>
</html>
