<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF Viewer</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #0f172a;
        color: #e2e8f0;
        font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
      }

      .status {
        display: grid;
        place-items: center;
        height: 100%;
        padding: 20px;
        text-align: center;
      }

      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: none;
        background: #ffffff;
      }
    </style>
  </head>
  <body>
    <div id="status" class="status">Loading PDF...</div>
    <iframe id="pdfFrame" title="PDF"></iframe>
    <script src="viewer.js"></script>
  </body>
</html>
